name: move-lakehouses

on:
  workflow_dispatch:
    inputs:
      new_branch:
        description: 'Name of the new branch to create (Lakehouses only)'
        required: true
        default: 'lakehouses-only'

jobs:
  move-lakehouses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create new branch from main
        run: |
          git checkout main
          git checkout -b ${{ github.event.inputs.new_branch }}

      - name: Remove everything except Lakehouse folders
        run: |
          find . -maxdepth 1 -mindepth 1 \
            ! -name '.git' \
            ! -name 'Bronze_LH.Lakehouse' \
            ! -name 'Gold_LH.Lakehouse' \
            ! -name 'Silver_LH.Lakehouse' \
            -exec rm -rf {} +

      - name: Commit and push new branch
        run: |
          git add -A
          git commit -m "Create branch with only Lakehouse folders" || echo "Nothing to commit"
          git push origin ${{ github.event.inputs.new_branch }}
