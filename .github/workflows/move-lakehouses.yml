name: move-lakehouses

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Existing branch to clean up (keep only Lakehouse folders)'
        required: true
        default: 'Lakehouse'

jobs:
  move-lakehouses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout target branch
        run: |
          git checkout ${{ github.event.inputs.target_branch }}

      - name: Remove everything except Lakehouse folders
        run: |
          find . -maxdepth 1 -mindepth 1 \
            ! -name '.git' \
            ! -name 'Bronze_LH.Lakehouse' \
            ! -name 'Gold_LH.Lakehouse' \
            ! -name 'Silver_LH.Lakehouse' \
            -exec rm -rf {} +

      - name: Commit and push changes
        run: |
          git add -A
          git commit -m "Keep only Lakehouse folders on this branch" || echo "Nothing to commit"
          git push origin ${{ github.event.inputs.target_branch }}
